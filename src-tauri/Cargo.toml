[package]
name = "pid-tuner"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Guided blackbox PID/filter tuning for Betaflight and ArduPilot"

[lib]
name = "pid_tuner_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[lints]
workspace = true

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
tauri-plugin-dialog = "2"
serde = { workspace = true }
serde_json = { workspace = true }
domain = { workspace = true }
bbl-ingest = { workspace = true }
log-ingest = { workspace = true }
analysis = { workspace = true }
recommend = { workspace = true }
session = { workspace = true }
fc-msp = { workspace = true }
fc-mavlink = { workspace = true }
appconfig = { workspace = true }
llm = { workspace = true }
reqwest = { version = "0.13", default-features = false, features = ["rustls", "json", "http2", "charset"] }
async-trait = "0.1"
uuid = { workspace = true }
chrono = { version = "0.4", features = ["serde"] }
dsp = { workspace = true }

[dev-dependencies]
tempfile = "3"
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
