name: Release desktop builds

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing tag to build and attach binaries to"
        required: true

permissions:
  contents: write

jobs:
  macos:
    name: macOS universal DMG
    runs-on: [self-hosted, macOS, arkana-mac]
    timeout-minutes: 60
    env:
      PATH: /Users/arkana/.cargo/bin:/opt/homebrew/bin:/usr/local/bin:/usr/bin:/bin:/usr/sbin:/sbin
    steps:
      - name: Resolve target tag
        id: tag
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "tag=${{ github.event.inputs.tag }}" >> "$GITHUB_OUTPUT"
          else
            echo "tag=${GITHUB_REF#refs/tags/}" >> "$GITHUB_OUTPUT"
          fi
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ steps.tag.outputs.tag }}
      - name: Toolchain versions
        run: |
          rustc --version; cargo --version; node --version; pnpm --version
          rustup target add x86_64-apple-darwin aarch64-apple-darwin
      - name: Install deps
        run: pnpm install --frozen-lockfile
      - name: Build universal app
        run: pnpm tauri build --target universal-apple-darwin --bundles app
      - name: Make DMG (hdiutil, no Finder needed)
        run: |
          set -e
          VER=$(node -e "console.log(require('./package.json').version)")
          cd target/universal-apple-darwin/release/bundle
          rm -rf dmgroot && mkdir dmgroot
          cp -R "macos/PID Tuner.app" dmgroot/
          ln -s /Applications dmgroot/Applications
          mkdir -p dmg
          hdiutil create -volname "PID Tuner" -srcfolder dmgroot -ov -format UDZO "dmg/PID-Tuner-${VER}-macos-universal.dmg"
          ls -la dmg
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: macos-dmg
          path: target/universal-apple-darwin/release/bundle/dmg/*.dmg
          if-no-files-found: error

  windows:
    name: Windows installer
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - name: Resolve target tag
        id: tag
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "tag=${{ github.event.inputs.tag }}" >> "$GITHUB_OUTPUT"
          else
            echo "tag=${GITHUB_REF#refs/tags/}" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/checkout@v4
        with:
          ref: ${{ steps.tag.outputs.tag }}
      - uses: dtolnay/rust-toolchain@stable
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: ". -> target"
      - name: Install deps
        run: pnpm install --frozen-lockfile
      - name: Build (NSIS installer + portable exe)
        run: pnpm tauri build --bundles nsis
      - name: Collect
        shell: bash
        run: |
          set -e
          VER=$(node -e "console.log(require('./package.json').version)")
          mkdir -p out
          cp target/release/bundle/nsis/*.exe "out/PID-Tuner-${VER}-windows-x64-setup.exe"
          cp target/release/pid-tuner.exe "out/PID-Tuner-${VER}-windows-x64-portable.exe"
          ls -la out
      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: out/*
          if-no-files-found: error

  release:
    name: Publish GitHub Release
    needs: [macos, windows]
    runs-on: ubuntu-latest
    steps:
      - name: Resolve target tag
        id: tag
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "tag=${{ github.event.inputs.tag }}" >> "$GITHUB_OUTPUT"
          else
            echo "tag=${GITHUB_REF#refs/tags/}" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
      - name: Create / update release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.tag.outputs.tag }}
        run: |
          set -e
          ls -R artifacts
          if ! gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release create "$TAG" --repo "$GITHUB_REPOSITORY" --title "PID Tuner $TAG" --generate-notes
          fi
          gh release upload "$TAG" --repo "$GITHUB_REPOSITORY" --clobber artifacts/macos-dmg/*.dmg artifacts/windows/*
